name: CI y despliegue de calculadora

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pytest
        run: python -m pytest -v
  deploy:
    needs: tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        run: |
          mkdir _site
          cp index.html _site/index.html
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
