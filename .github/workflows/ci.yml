name: CI de calculadora e IMC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pytest
        run: python -m pytest -v
