name: CI para Railway
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-web.txt
      - run: python -m pytest -v
      - name: Comprobar imagen y servidor
        run: |
          docker build -t calculadora-ci .
          docker run -d --name calculadora-ci -e PORT=8080 -p 8080:8080 calculadora-ci
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8080/health; then
              curl --fail http://localhost:8080/
              exit 0
            fi
            sleep 2
          done
          docker logs calculadora-ci
          exit 1
